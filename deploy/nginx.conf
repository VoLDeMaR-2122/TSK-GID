# Пример reverse-proxy перед контейнерами.
#
# Нужен, чтобы внешние посетители получали сайт и WebSocket по одному
# адресу: / → фронтенд, /ws → бэкенд. Порт 3001 опубликован только на
# loopback хоста (см. docker-compose.yml), наружу его не видно.
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gid
#   sudo ln -s /etc/nginx/sites-available/gid /etc/nginx/sites-enabled/gid
#   sudo nginx -t && sudo systemctl reload nginx

upstream gid_frontend {
    server 127.0.0.1:3000;
}

upstream gid_backend {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name gid.example.ru;   # <- свой домен

    # Если нужен HTTPS, раскомментируй после выпуска сертификата:
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gid.example.ru;

    # ssl_certificate     /etc/letsencrypt/live/gid.example.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gid.example.ru/privkey.pem;

    # WebSocket: критично прокинуть заголовки Upgrade и Connection,
    # иначе соединение до бэкенда не установится.
    location /ws {
        proxy_pass http://gid_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Дежурный может сидеть на линии без связи — не рвём соединение.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # Всё остальное — фронтенд Next.js
    location / {
        proxy_pass http://gid_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
