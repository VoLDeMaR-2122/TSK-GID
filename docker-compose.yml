services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-gid}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gid} -d ${POSTGRES_DB:-gid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ВАЖНО: имя сервиса должно быть точно 'app'
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Встраивается в бандл Next.js на этапе сборки.
        # ОСТАВЬТЕ ПУСТЫМ для обычного деплоя: тогда клиент сам
        # подключится к тому же хосту по /ws, а прокси направит его
        # на бэкенд. Значение нужно только если бэкенд доступен
        # по отдельному адресу — и тогда укажите публичный, не 127.0.0.1:
        # значение попадает в бандл и выполняется в браузере ПОСЕТИТЕЛЯ.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000          # <- Фронтенд Next.js слушает этот порт
      HOSTNAME: 0.0.0.0

      BACKEND_PORT: 3001   # <- Rust-бэкенд: логика, БД, WebSocket
      BACKEND_HOST: 0.0.0.0

      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-gid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-gid}

      # Первый администратор. Создаётся при первом запуске, если в базе
      # ещё нет ни одного администратора. Пароль сохраняется только как
      # argon2id-хеш — открытым текстом в базу не попадает.
      GID_ADMIN_LOGIN: ${GID_ADMIN_LOGIN:?задайте логин первого администратора}
      GID_ADMIN_PASSWORD: ${GID_ADMIN_PASSWORD:?задайте пароль первого администратора}
      GID_ADMIN_NAME: ${GID_ADMIN_NAME:-Администратор участка}

      # Разрешённые источники WebSocket, через запятую
      GID_ALLOWED_ORIGINS: ${GID_ALLOWED_ORIGINS:-}
    ports:
      # Хост-публикация портов — только для прямого доступа без reverse-proxy.
      # В Dokploy оставь HOST_FRONT_PORT/HOST_BACK_PORT пустыми: Traefik ходит
      # во внутренние порты контейнера напрямую, а хост-порт 3000 на сервере
      # уже занят самим Dokploy. Для ручного деплоя задай HOST_FRONT_PORT=3000
      # и HOST_BACK_PORT=3001 — под них настроен deploy/nginx.conf.
      - "${HOST_FRONT_PORT:+${HOST_FRONT_PORT}:}3000"
      - "${HOST_BACK_PORT:+127.0.0.1:${HOST_BACK_PORT}:}3001"

volumes:
  pgdata:
