services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gid
      POSTGRES_PASSWORD: gidpass
      POSTGRES_DB: gid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gid -d gid"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ВАЖНО: Имя сервиса должно быть точно 'app'
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000          # <- Приложение слушает этот порт ВНУТРИ контейнера
      HOSTNAME: 0.0.0.0
      DB_HOST: db
      POSTGRES_USER: gid
      POSTGRES_PASSWORD: gidpass
      POSTGRES_DB: gid
    expose:
      - "3000"            # <- Разрешаем доступ к порту 3000 изнутри сети Docker

volumes:
  pgdata:
